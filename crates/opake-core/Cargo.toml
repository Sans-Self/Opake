[package]
name = "opake-core"
description = "Encryption, records, and XRPC client for Opake — platform-agnostic, WASM-compatible"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
test-utils = []

[dependencies]
log.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

aes-gcm = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-kw = { version = "0.2", features = ["alloc"] }
hkdf = "0.12"                   # HKDF key derivation (RFC 5869)
sha2 = "0.10"                   # SHA-256 hash — used by HKDF internally
base64 = "0.22"                 # atproto $bytes encoding

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

# aes-gcm pulls in getrandom transitively. On wasm32, getrandom needs the
# "js" feature to use crypto.getRandomValues() instead of OS-level randomness.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
