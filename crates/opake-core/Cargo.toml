[package]
name = "opake-core"
description = "Encryption, records, and XRPC client for Opake — platform-agnostic, WASM-compatible"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
test-utils = []
reqwest-transport = ["dep:reqwest", "dep:bytes"]
wasm-transport = ["dep:web-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures"]
dns = ["dep:hickory-resolver"]
native = ["reqwest-transport", "dns"]

[dependencies]
opake-crypto = { path = "../opake-crypto" }
opake-derive = { path = "../opake-derive" }
base64.workspace = true
ed25519-dalek.workspace = true
futures-channel.workspace = true
futures-util.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# Zeroizing<...> for in-memory secret handling (pair flow, decryption buffers,
# storage-side signing-key migration). x25519-dalek / libcrux-ml-kem are pulled
# in transitively via opake-crypto — opake-core never reaches into them
# directly.
zeroize.workspace = true

# DPoP JWT thumbprint + OAuth PKCE challenge.
sha2.workspace = true

reqwest = { workspace = true, optional = true }
bytes = { version = "1", optional = true }
hickory-resolver = { version = "0.24", optional = true }

# DPoP proofs and OAuth token-binding — kept here because they're a client
# concern, not a primitive-crypto one.
p256 = { version = "0.13", features = ["ecdsa", "jwk"] }
urlencoding = "2"

[dev-dependencies]
rand_chacha = "0.3"             # Deterministic RNG for reproducible test vectors
tokio = { workspace = true, features = ["macros", "rt"] }
# Direct deps for test fixtures that need deterministic keypairs from fixed seeds.
# Production opake-core reaches into them only via re-exports from opake-crypto.
x25519-dalek.workspace = true
libcrux-ml-kem.workspace = true

# aes-gcm (via opake-crypto) pulls in getrandom transitively. On wasm32,
# getrandom needs the "js" feature to use crypto.getRandomValues() instead
# of OS-level randomness.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Headers", "Request", "RequestInit", "Response",
    "EventSource", "MessageEvent", "Event", "EventTarget",
], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
