[package]
name = "opake-wasm"
description = "WASM bindings for opake-core crypto primitives"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Emit TypeScript declarations for cross-boundary DTOs into
# packages/opake-sdk/src/generated/. Off by default; on via `just ts-bindings`.
ts-bindings = ["dep:ts-rs"]

[dependencies]
opake-core = { path = "../opake-core", features = ["wasm-transport"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
console_log = { version = "1", features = ["color"] }
console_error_panic_hook = "0.1"

# Async Mutex for the shared WasmOpake — RefCell panics on concurrent
# borrow across await points; Mutex queues instead.
futures-util = { workspace = true }

# OsRng on wasm32 needs crypto.getRandomValues()
getrandom = { version = "0.2", features = ["js"] }

ts-rs = { version = "10", optional = true }

# wasm-pack post-process: explicit wasm-opt invocation.
#
# Pinning the flags here makes the post-process deterministic regardless of
# wasm-pack version. `--enable-bulk-memory` is required because rustc's
# WASM output uses bulk-memory ops by default — older binaryen (117, bundled
# with wasm-pack 0.13.1) rejects them without this flag, which is why the
# default `wasm-opt -O` invocation fails on stock wasm-pack today.
#
# `-Oz` is the most aggressive size-bias optimisation pass. The strip flags
# remove debug info and producer-tool annotations that bloat the binary.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-Oz",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
    "--strip-debug",
    "--strip-producers",
    "--vacuum",
]
