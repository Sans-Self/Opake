services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 5

  appview:
    build:
      context: appview
      dockerfile: ../Containerfile.appview
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://postgres:postgres@db/opake_appview_prod
      SECRET_KEY_BASE: dev-only-please-change-in-production-64-chars-aaaaaaaaaaaaaaaa
      PHX_HOST: localhost
      PHX_SERVER: "true"
      JETSTREAM_URL: wss://jetstream2.us-east.bsky.network/subscribe
    ports:
      - "6100:6100"
    profiles:
      - full

volumes:
  pgdata:
