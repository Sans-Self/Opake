when:
  - event: ["push", "pull_request"]
    branch: ["main"]

engine: "nixery"

dependencies:
  nixpkgs:
    - rustc
    - cargo
    - clippy
    - rustfmt
    - gcc
    - pkg-config
    - cmake

steps:
  - name: "Check formatting"
    command: "cargo fmt -- --check"

  - name: "Clippy"
    command: "cargo clippy --all-targets -- -D warnings"

  - name: "Test"
    command: "cargo test"
