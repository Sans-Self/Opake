image: rust:1.88-slim-bookworm
engine: "kubernetes"
architecture: arm64

when:
  - event: ["push", "pull_request"]
    branch: ["main"]

steps:
  - name: "Install deps"
    command: |
      apt-get update -y && apt-get install -y --no-install-recommends pkg-config cmake gcc g++
      rustup component add clippy rustfmt

  - name: "Check formatting"
    command: cargo fmt -- --check

  - name: "Clippy"
    command: cargo clippy --all-targets -- -D warnings

  - name: "Test"
    command: cargo test
