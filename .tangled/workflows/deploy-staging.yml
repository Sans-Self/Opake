image: zot.sans-self.org/infra/ci-opake:latest
engine: "kubernetes"
architecture: arm64

when:
  - event: ["push"]
    branch: ["main"]

steps:
  - name: "Setup registry auth"
    command: |
      echo "Authenticating as: $ZOT_USERNAME"
      buildah login -u "$ZOT_USERNAME" -p "$ZOT_PASSWORD" zot.sans-self.org

  - name: "Build and push indexer"
    command: |
      buildah bud \
        -f Containerfile.indexer \
        -t zot.sans-self.org/opake/indexer:staging \
        -t zot.sans-self.org/opake/indexer:staging-$TANGLED_COMMIT_SHA \
        indexer
      buildah push zot.sans-self.org/opake/indexer:staging
      buildah push zot.sans-self.org/opake/indexer:staging-$TANGLED_COMMIT_SHA

  - name: "Build and push web"
    command: |
      buildah bud \
        -f Containerfile.web \
        --build-arg VITE_INDEXER_URL=https://indexer.staging.opake.app \
        --build-arg VITE_SITE_URL=https://staging.opake.app \
        -t zot.sans-self.org/opake/web:staging \
        -t zot.sans-self.org/opake/web:staging-$TANGLED_COMMIT_SHA \
        .
      buildah push zot.sans-self.org/opake/web:staging
      buildah push zot.sans-self.org/opake/web:staging-$TANGLED_COMMIT_SHA

  - name: "Rollout restart staging"
    command: |
      curl -sLO "https://dl.k8s.io/release/v1.32.0/bin/linux/arm64/kubectl"
      chmod +x kubectl
      ./kubectl rollout restart deployment/opake-web deployment/opake-indexer -n opake-staging
