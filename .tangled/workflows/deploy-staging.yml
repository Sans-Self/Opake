image: zot.sans-self.org/infra/ci-opake:latest
engine: "kubernetes"
architecture: arm64

when:
  - event: ["push"]
    branch: ["main"]

steps:
  - name: "Setup registry auth"
    command: |
      echo "Authenticating as: $ZOT_USERNAME"
      buildah login -u "$ZOT_USERNAME" -p "$ZOT_PASSWORD" zot.sans-self.org

  - name: "Build and push appview"
    command: |
      buildah bud \
        -f Containerfile.appview \
        -t zot.sans-self.org/opake/appview:staging \
        -t zot.sans-self.org/opake/appview:staging-$TANGLED_COMMIT_SHA \
        appview
      buildah push zot.sans-self.org/opake/appview:staging
      buildah push zot.sans-self.org/opake/appview:staging-$TANGLED_COMMIT_SHA

  - name: "Build and push web"
    command: |
      buildah bud \
        -f Containerfile.web \
        --build-arg VITE_APPVIEW_URL=https://appview.staging.opake.app \
        --build-arg VITE_SITE_URL=https://staging.opake.app \
        -t zot.sans-self.org/opake/web:staging \
        -t zot.sans-self.org/opake/web:staging-$TANGLED_COMMIT_SHA \
        .
      buildah push zot.sans-self.org/opake/web:staging
      buildah push zot.sans-self.org/opake/web:staging-$TANGLED_COMMIT_SHA

  - name: "Rollout restart staging"
    command: |
      curl -sLO "https://dl.k8s.io/release/v1.32.0/bin/linux/arm64/kubectl"
      chmod +x kubectl
      ./kubectl rollout restart deployment/opake-web deployment/opake-appview -n opake-staging
