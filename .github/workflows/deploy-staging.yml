name: deploy-staging

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Scaleway registry
        uses: docker/login-action@v3
        with:
          registry: rg.fr-par.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push indexer
        uses: docker/build-push-action@v6
        with:
          context: apps/indexer
          file: Containerfile.indexer
          platforms: linux/amd64
          push: true
          tags: |
            rg.fr-par.scw.cloud/opake/indexer:staging
            rg.fr-par.scw.cloud/opake/indexer:staging-${{ github.sha }}
          cache-from: type=gha,scope=indexer
          cache-to: type=gha,scope=indexer,mode=max

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile.web
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_INDEXER_URL=https://indexer.staging.opake.at
            VITE_SITE_URL=https://staging.opake.at
          tags: |
            rg.fr-par.scw.cloud/opake/web:staging
            rg.fr-par.scw.cloud/opake/web:staging-${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Render secrets
        run: |
          kubectl create secret generic opake-secrets \
            --namespace opake-staging \
            --from-literal secret-key-base='${{ secrets.STAGING_SECRET_KEY_BASE }}' \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic opake-database-url \
            --namespace opake-staging \
            --from-literal url='${{ secrets.STAGING_DATABASE_URL }}' \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic staging-basicauth \
            --namespace opake-staging \
            --from-literal users='${{ secrets.STAGING_BASICAUTH_USERS }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply staging overlay
        run: kubectl apply -k deploy/k8s/overlays/staging

      - name: Roll deployments
        run: |
          kubectl rollout restart deployment/opake-web deployment/opake-indexer -n opake-staging
          kubectl rollout status deployment/opake-indexer -n opake-staging --timeout=300s
          kubectl rollout status deployment/opake-web -n opake-staging --timeout=300s
