# CLA Assistant (self-hosted via GitHub Action — no third-party service).
#
# Signatures are stored as JSON in this repo on the `cla-signatures` branch;
# nothing leaves GitHub. The bot comments on every PR asking the contributor to
# sign, blocks merge until they do, and remembers them afterwards.

name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-assistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: >
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/version1/cla.json"
          path-to-document: "https://github.com/Opake-at/Opake/blob/main/CLA.md"
          branch: "cla-signatures"
          allowlist: "Annoiiyed,dependabot[bot],github-actions[bot]"
          custom-notsigned-prcomment: >
            Thank you for your contribution. Before it can be merged, please read
            our [Contributor License Agreement](https://github.com/Opake-at/Opake/blob/main/CLA.md)
            and sign it by posting a comment with the text below.
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "All contributors have signed the CLA. ✍️"
