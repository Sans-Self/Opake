[workspace]
members = ["crates/opake-core", "crates/opake-derive", "crates/opake-wasm", "apps/cli"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "AGPL-3.0-or-later"

# Size-optimised release profile.
#
# Picked for the WASM binary that ships to the browser via `just wasm`. The
# defaults (opt-level 3, no LTO, 16 codegen-units, unwinding panics) leave
# substantial bytes on the floor — `lto = "fat"` alone reclaims most of it
# by killing cross-crate monomorphization duplicates that wasm-pack's
# wasm-opt pass can't fully reach.
#
# `panic = "abort"` is safe here because nothing in the WASM path catches
# panics; aborting drops the unwinding tables. `strip = "symbols"` removes
# debug symbols that wasm-pack would otherwise leave embedded.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "color"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
env_logger = "0.11"
futures-channel = { version = "0.3", default-features = false, features = ["std", "sink"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await-macro"] }
log = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1"
